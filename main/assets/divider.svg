<svg width="1000" height="2" viewBox="0 0 1000 2" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F1E8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A8D5BA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5F1E8" stop-opacity="0"/>
      <animate attributeName="x1" values="-50%;100%;-50%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="50%;200%;50%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="2" fill="#E4DFD3"/>
  <rect width="1000" height="2" fill="url(#shimmer)"/>
</svg>
